name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock
          pip install --no-deps -e .
      - name: Run fast test suite
        run: make test-quick

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install "ruff>=0.6,<1"
      - name: Ruff check
        run: ruff check src tests
      - name: Ruff format check
        run: ruff format --check src/mous_pipeline/config.py src/mous_pipeline/paths.py src/mous_pipeline/m8_reports/quarto_report.py tests/test_config_env_interpolation.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build image
        run: docker build -t mous-pipeline:ci .
      - name: Smoke test CLI
        run: docker run --rm mous-pipeline:ci --help
      - name: Smoke test dry-run
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/configs:/config:ro" \
            mous-pipeline:ci run \
            --config /config/example_container.yaml \
            --subject A2002 \
            --dry-run \
            --skip m5,m10,m11,m12

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, lint, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
