name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Run fast regression tests
        run: |
          pytest -q tests/test_runner_dry_run.py tests/test_m1_events.py tests/test_runner_failure_policy.py tests/test_m10_stub.py tests/test_parallelization_plan.py
