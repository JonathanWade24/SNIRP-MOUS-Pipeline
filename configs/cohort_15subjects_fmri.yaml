data_root: "~/mous_data"
derivatives_root: "derivatives/mous_pipeline"

subjects:
  - "A2002"
  - "A2003"
  - "A2004"
  - "A2005"
  - "A2006"
  - "A2007"
  - "A2008"
  - "A2009"
  - "A2010"
  - "A2013"
  - "A2014"
  - "A2015"
  - "A2027"

# RDR (Repocli): one-time `repocli config` with base URL https://webdav.data.ru.nl
rdr:
  collection_path: "dccn/DSC_3011020.09_236_v1"

preprocess:
  backend: "inhouse"
  bids_pipeline_deriv_root: ""
  notch_freqs: [50, 100, 150]
  resample_hz: 300.0
  ica_n_components: 40
  ecg_threshold: 0.9
  ecg_max_components: 3

epoching:
  tmin: -0.85
  tmax: 3.0
  baseline: [-0.5, 0.0]
  min_trials_per_condition: 50

features:
  bands:
    theta: [4.0, 8.0]
    alpha: [8.0, 13.0]
    beta: [13.0, 30.0]
    gamma: [30.0, 80.0]

# Aim 1 / m5 source reconstruction. FreeSurfer recon-all outputs are written by
# scripts/analysis_02_freesurfer_recon.sh.
source:
  subjects_dir: "derivatives/freesurfer"
  use_fsaverage: true
  beamformer: "lcmv"
  spacing: "oct6"
  trans: "fsaverage"
  conductivity: [0.3]
  reg: 0.05
  pick_ori: "max-power"
  weight_norm: "unit-noise-gain"

# Aim 2 fMRI coupling.
fmri:
  bold_path: ""
  tr: 2.0
  atlas: "glasser"
  roi: "L_TE1a"
  fmriprep_container: ""
  fmriprep_output: "derivatives/fmriprep"
  skip_fmriprep: false
  skip_bids_validation: false
  neurodesk_module: "fmriprep"
  fs_license_file: "/data/freesurfer/license.txt"

# Aim 3 null-wave validation (m12).
wave_validation:
  enabled: true
  n_trials: 60
  snr: 1.0
  random_state: 42
