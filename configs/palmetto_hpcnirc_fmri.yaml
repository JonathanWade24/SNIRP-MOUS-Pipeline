# Palmetto hpcnirc template — set env vars before running (see docs/reproducibility.md).
# Example (Clemson Palmetto):
#   export MOUS_DATA_ROOT=/scratch/$USER/mous_data
#   export MOUS_DERIVATIVES_ROOT=/scratch/$USER/mous_derivatives
#   export MOUS_CONTAINER_DIR=/scratch/$USER/containers
#   export FS_LICENSE=/data/freesurfer/license.txt

data_root: "${MOUS_DATA_ROOT}"
derivatives_root: "${MOUS_DERIVATIVES_ROOT}"

subjects:
  - "A2002"
  - "A2003"

rdr:
  collection_path: "dccn/DSC_3011020.09_236_v1"

preprocess:
  backend: "inhouse"
  bids_pipeline_deriv_root: ""
  notch_freqs: [50, 100, 150]
  resample_hz: 300.0
  ica_n_components: 40
  ecg_threshold: 0.9
  ecg_max_components: 3

epoching:
  tmin: -0.85
  tmax: 3.0
  baseline: [-0.5, 0.0]
  min_trials_per_condition: 50

features:
  bands:
    theta: [4.0, 8.0]
    alpha: [8.0, 13.0]
    beta: [13.0, 30.0]
    gamma: [30.0, 80.0]

source:
  subjects_dir: "${MOUS_DERIVATIVES_ROOT}/freesurfer"
  use_fsaverage: false
  beamformer: "lcmv"
  spacing: "oct6"
  trans: "fsaverage"
  conductivity: [0.3]
  reg: 0.05
  pick_ori: "max-power"
  weight_norm: "unit-noise-gain"

fmri:
  bold_path: ""
  tr: 2.0
  atlas: "glasser"
  roi: "L_TE1a"
  fmriprep_container: "${MOUS_CONTAINER_DIR}/fmriprep.sif"
  fmriprep_output: "${MOUS_DERIVATIVES_ROOT}/fmriprep"
  skip_fmriprep: false
  skip_bids_validation: false
  neurodesk_module: ""
  fs_license_file: "${FS_LICENSE}"
  onset_shift_s: 0.0
  hrf_lag_sweep_s: [4.0, 5.0, 6.0, 7.0, 8.0]
  container_runtime: ""
  container_binds:
    - "${MOUS_DERIVATIVES_ROOT}:${MOUS_DERIVATIVES_ROOT}"
    - "${MOUS_DATA_ROOT}:${MOUS_DATA_ROOT}"
    - "${MOUS_DERIVATIVES_ROOT}/templateflow:/opt/templateflow"

wave_validation:
  enabled: true
  n_trials: 60
  snr: 1.0
  random_state: 42
  z_threshold: 1.645

pipeline:
  m10_reuse_fmriprep: true
  m11_allow_cached_joined: true
