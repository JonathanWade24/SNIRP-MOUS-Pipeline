# Palmetto template for hpcnirc partition.
# Copy and customize all paths for your account/allocation.

# Keep paths space-free for fMRIPrep/FSL/ANTs compatibility.
data_root: "/scratch/jonathanwade/mous_data"
derivatives_root: "/scratch/jonathanwade/mous_derivatives"

subjects:
  - "A2002"
  - "A2003"

rdr:
  collection_path: "dccn/DSC_3011020.09_236_v1"

preprocess:
  backend: "inhouse"
  bids_pipeline_deriv_root: ""
  notch_freqs: [50, 100, 150]
  resample_hz: 300.0
  ica_n_components: 40
  ecg_threshold: 0.9
  ecg_max_components: 3

epoching:
  tmin: -0.85
  tmax: 3.0
  baseline: [-0.5, 0.0]
  min_trials_per_condition: 50

features:
  bands:
    theta: [4.0, 8.0]
    alpha: [8.0, 13.0]
    beta: [13.0, 30.0]
    gamma: [30.0, 80.0]

source:
  # Subject-specific source model: requires recon-all + BEM surfaces under subjects_dir.
  subjects_dir: "/scratch/jonathanwade/mous_derivatives/freesurfer"
  use_fsaverage: false
  beamformer: "lcmv"
  spacing: "oct6"
  # Keep fsaverage for template-space transform, or set a subject-specific trans path template.
  trans: "fsaverage"
  conductivity: [0.3]
  reg: 0.05
  pick_ori: "max-power"
  weight_norm: "unit-noise-gain"

fmri:
  bold_path: ""
  tr: 2.0
  atlas: "glasser"
  roi: "L_TE1a"
  # Point to your apptainer/singularity image on Palmetto.
  fmriprep_container: "/scratch/jonathanwade/containers/fmriprep.sif"
  # Keep output/work/license paths on mounted, writable filesystems.
  fmriprep_output: "/scratch/jonathanwade/mous_derivatives/fmriprep"
  skip_fmriprep: false
  skip_bids_validation: false
  neurodesk_module: ""
  fs_license_file: "/scratch/jonathanwade/licenses/freesurfer/license.txt"
  onset_shift_s: 0.0
  hrf_lag_sweep_s: [4.0, 5.0, 6.0, 7.0, 8.0]
  # Optional: force a runtime. Leave empty to auto-detect apptainer->singularity.
  container_runtime: ""
  # Optional binds in SRC:DST form for container exec.
  # Example: expose scratch/templateflow caches inside container.
  container_binds:
    - "/scratch/jonathanwade:/scratch/jonathanwade"
    - "/scratch/jonathanwade/templateflow:/opt/templateflow"
    - "/scratch/jonathanwade/licenses:/scratch/jonathanwade/licenses"

wave_validation:
  enabled: true
  n_trials: 60
  snr: 1.0
  random_state: 42
  z_threshold: 1.645

pipeline:
  m10_reuse_fmriprep: true
  m11_allow_cached_joined: true
