# Palmetto template for hpcnirc partition.
# Copy and customize all paths for your account/allocation.

# Keep paths space-free for fMRIPrep/FSL/ANTs compatibility.
data_root: "/scratch/$USER/mous_data"
derivatives_root: "/scratch/$USER/mous_derivatives"

subjects:
  - "A2002"
  - "A2003"

rdr:
  collection_path: "dccn/DSC_3011020.09_236_v1"

preprocess:
  backend: "inhouse"
  bids_pipeline_deriv_root: ""
  notch_freqs: [50, 100, 150]
  resample_hz: 300.0
  ica_n_components: 40
  ecg_threshold: 0.9
  ecg_max_components: 3

epoching:
  tmin: -0.85
  tmax: 3.0
  baseline: [-0.5, 0.0]
  min_trials_per_condition: 50

features:
  bands:
    theta: [4.0, 8.0]
    alpha: [8.0, 13.0]
    beta: [13.0, 30.0]
    gamma: [30.0, 80.0]

source:
  # Set this after recon-all outputs exist (see docs/palmetto_hpcnirc.md).
  subjects_dir: "/scratch/$USER/mous_derivatives/freesurfer"
  use_fsaverage: true
  beamformer: "lcmv"
  spacing: "oct6"
  trans: "fsaverage"
  conductivity: [0.3]
  reg: 0.05
  pick_ori: "max-power"
  weight_norm: "unit-noise-gain"

fmri:
  bold_path: ""
  tr: 2.0
  atlas: "glasser"
  roi: "L_TE1a"
  # Point to your apptainer/singularity image on Palmetto.
  fmriprep_container: "/project/$USER/containers/fmriprep.sif"
  # Keep output/work/license paths on mounted, writable filesystems.
  fmriprep_output: "/scratch/$USER/mous_derivatives/fmriprep"
  skip_fmriprep: false
  skip_bids_validation: false
  neurodesk_module: ""
  fs_license_file: "/project/$USER/licenses/freesurfer/license.txt"
  # Optional: force a runtime. Leave empty to auto-detect apptainer->singularity.
  container_runtime: ""
  # Optional binds in SRC:DST form for container exec.
  # Example: expose scratch/project/templateflow caches inside container.
  container_binds:
    - "/scratch/$USER:/scratch/$USER"
    - "/project/$USER:/project/$USER"
    - "/scratch/$USER/templateflow:/opt/templateflow"
    - "/project/$USER/licenses:/project/$USER/licenses"

wave_validation:
  enabled: true
  n_trials: 60
  snr: 1.0
  random_state: 42
