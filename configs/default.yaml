data_root: "."
derivatives_root: "derivatives/mous_pipeline"
subjects: []
preprocess:
  backend: "inhouse"
  notch_freqs: [50, 100, 150]
  resample_hz: 300.0
  ica_n_components: 40
  ecg_threshold: 0.9
  ecg_max_components: 3
epoching:
  tmin: -0.5
  tmax: 3.0
  baseline: [-0.5, 0.0]
  min_trials_per_condition: 50
features:
  bands:
    theta: [4.0, 8.0]
    alpha: [8.0, 13.0]
    beta: [13.0, 30.0]
    gamma: [30.0, 80.0]
pipeline:
  enabled_stages: ["m0", "m1", "m2", "m3", "m4", "m6a", "m7", "m8", "m9"]
