data_root: "/scratch/jonathanwade/mous_data"
derivatives_root: "/scratch/jonathanwade/mous_derivatives"

subjects:
  - "A2004"
  - "A2005"
  - "A2006"
  - "A2007"
  - "A2008"
  - "A2009"
  - "A2010"
  - "A2011"
  - "A2012"
  - "A2013"
  - "A2014"

rdr:
  collection_path: "dccn/DSC_3011020.09_236_v1"

preprocess:
  backend: "inhouse"
  bids_pipeline_deriv_root: ""
  notch_freqs: [50, 100, 150]
  resample_hz: 300.0
  ica_n_components: 40
  ecg_threshold: 0.9
  ecg_max_components: 3

epoching:
  tmin: -0.85
  tmax: 3.0
  baseline: [-0.5, 0.0]
  min_trials_per_condition: 50

features:
  bands:
    theta: [4.0, 8.0]
    alpha: [8.0, 13.0]
    beta: [13.0, 30.0]
    gamma: [30.0, 80.0]

source:
  subjects_dir: "/scratch/jonathanwade/mous_derivatives/freesurfer"
  use_fsaverage: false
  beamformer: "lcmv"
  spacing: "oct6"
  # Keep fsaverage for template-space transform, or set a subject-specific trans path template.
  trans: "fsaverage"
  conductivity: [0.3]
  reg: 0.05
  pick_ori: "max-power"
  weight_norm: "unit-noise-gain"

fmri:
  bold_path: ""
  tr: 2.0
  atlas: "glasser"
  roi: "L_TE1a"
  fmriprep_container: "/scratch/jonathanwade/containers/fmriprep.sif"
  fmriprep_output: "/scratch/jonathanwade/mous_derivatives/fmriprep"
  skip_fmriprep: false
  skip_bids_validation: false
  neurodesk_module: ""
  fs_license_file: "/scratch/jonathanwade/MOUS/licenses/freesurfer/license.txt"
  onset_shift_s: 0.0
  hrf_lag_sweep_s: [4.0, 5.0, 6.0, 7.0, 8.0]
  container_runtime: ""
  container_binds:
    - "/scratch/jonathanwade:/scratch/jonathanwade"
    - "/project/jonathanwade:/project/jonathanwade"
    - "/scratch/jonathanwade/templateflow:/opt/templateflow"
    - "/scratch/jonathanwade/MOUS/licenses:/scratch/jonathanwade/MOUS/licenses"

wave_validation:
  enabled: true
  n_trials: 60
  snr: 1.0
  random_state: 42
  z_threshold: 1.645

pipeline:
  m10_reuse_fmriprep: true
  m11_allow_cached_joined: true
