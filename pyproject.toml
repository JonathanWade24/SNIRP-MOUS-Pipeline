[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mous-pipeline"
version = "0.1.0"
description = "Modular MOUS analysis pipeline for oscillatory and wave dynamics"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "MOUS Pipeline Contributors"}
]
keywords = ["neuroscience", "MEG", "oscillations", "traveling-waves", "MOUS"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]

dependencies = [
  "mne>=1.6,<2",
  "mne-bids>=0.14,<1",
  "pycircstat>=0.0.2,<1",
  "tensorpac>=0.6,<1",
  "scikit-learn>=1.3,<2",
  "scipy>=1.11,<2",
  "numpy>=1.26,<3",
  "pandas>=2.0,<3",
  "matplotlib>=3.8,<4",
  "pyyaml>=6,<7",
  "pydantic>=2,<3",
  "nibabel>=5,<6",
  "statsmodels>=0.14,<1",
]

[project.urls]
Repository = "https://github.com/JonathanWade24/MOUS"
Issues = "https://github.com/JonathanWade24/MOUS/issues"

[project.scripts]
mous-pipeline = "mous_pipeline.cli:main"

[project.optional-dependencies]
gui = [
  "streamlit>=1.35,<2",
]
bids = [
  "mne-bids-pipeline>=1.8,<2",
  "mne-bids>=0.14,<1",
]
fmri = [
  "nilearn>=0.10,<1",
  "nibabel>=5,<6",
  "templateflow>=24,<25",
]
ops = [
  "textual>=0.80,<2",
]
dev = [
  "pytest>=8,<9",
  "pytest-xdist>=3,<4",
  "ruff>=0.6,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: tests that touch workspace data, scripts, or external-like paths",
  "slow: tests with materially longer runtime",
]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["src/mous_pipeline/gui_streamlit.py"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "F841", "F401", "E741"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
